<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Rabbitry - Geneva's Trading Post</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Rabbitry-specific styles */
        .page-header {
            text-align: center;
            padding: 2rem 1rem;
            background: #2c3e50;
            color: white;
            margin: 0;
        }
        
        .page-header h1 {
            font-size: 2.5rem;
            margin: 0;
            color: white;
        }
        
        .page-header p {
            font-size: 1.2rem;
            margin: 0.5rem 0 0 0;
            color: #ecf0f1;
            max-width: 800px;
            margin: 1rem auto;
        }
        
        nav {
            background: #34495e;
            padding: 1rem;
            text-align: center;
            border-bottom: 3px solid #3498db;
        }
        
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 1rem;
            font-weight: bold;
            padding: 0.7rem 1.3rem;
            border-radius: 5px;
            display: inline-block;
            transition: background 0.3s ease;
        }
        
        nav a:hover {
            background: #3498db;
        }
        
        .current {
            background: #3498db;
        }
        
        .rabbitry-intro {
            text-align: center;
            padding: 3rem 2rem;
            max-width: 900px;
            margin: 0 auto;
        }
        
        .rabbitry-intro h2 {
            color: #2c3e50;
            font-size: 2rem;
            margin-bottom: 1.5rem;
        }
        
        .rabbitry-intro p {
            font-size: 1.2rem;
            line-height: 1.7;
            color: #34495e;
            margin-bottom: 1rem;
        }
        
        .rabbit-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2.5rem;
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .rabbit-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .rabbit-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 25px rgba(0,0,0,0.15);
        }
        
        .rabbit-card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-bottom: 3px solid #3498db;
        }
        
        .rabbit-info {
            padding: 1.8rem;
        }
        
        .rabbit-info h3 {
            margin-top: 0;
            color: #2c3e50;
            font-size: 1.5rem;
            border-bottom: 2px solid #3498db;
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
        }
        
        .rabbit-info p {
            margin: 0.8rem 0;
            color: #34495e;
            font-size: 1.1rem;
        }
        
        .breed-tag {
            display: inline-block;
            background: #9b59b6;
            color: white;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            margin-right: 0.5rem;
            margin-bottom: 0.8rem;
        }
        
        .gender-tag {
            display: inline-block;
            background: #3498db;
            color: white;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            margin-right: 0.5rem;
            margin-bottom: 0.8rem;
        }
        
        .age-tag {
            display: inline-block;
            background: #2ecc71;
            color: white;
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            margin-right: 0.5rem;
            margin-bottom: 0.8rem;
        }
        
        .back-btn {
            display: inline-block;
            background: #7f8c8d;
            color: white;
            padding: 0.9rem 2rem;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            margin: 3rem auto;
            text-align: center;
            font-size: 1.1rem;
            transition: background 0.3s ease;
        }
        
        .back-btn:hover {
            background: #95a5a6;
        }
